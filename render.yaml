# Blueprint Render para a API Claritas (processo persistente com WebSocket) — ver docs/DEPLOY.md.
# Plano gratuito: runtime Node nativo (o Dockerfile em services/api fica como alternativa, não validado).
# O serviço free dorme após 15 min sem tráfego; o primeiro acesso depois disso leva ~1 min.
# Migrações: rodar `npm run db:migrate` localmente contra o Neon (o free não tem preDeployCommand).
services:
  - type: web
    name: claritas-api
    runtime: node
    plan: free
    # Singapura (mais perto da Binance) teve o IP de saída compartilhado banido pela Binance (418/429).
    region: frankfurt
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false # connection string do Neon (secreta)
      - key: CORS_ORIGIN
        sync: false # URL exata do frontend na Vercel, ex.: https://claritas.vercel.app
      - key: MARKET_DATA_PROVIDER
        value: binance_spot
      - key: BINANCE_SPOT_REST_URL
        value: https://data-api.binance.vision
      - key: BINANCE_SPOT_WS_URL
        value: wss://data-stream.binance.vision:443
      - key: LOG_LEVEL
        value: info
      # IP do cliente via X-Forwarded-For: balanceador do Render + repasse /api/v1 da Vercel (ADR-018).
      # Conferir nos logs após o deploy (docs/DEPLOY.md → Publicar a autenticação).
      - key: TRUST_PROXY
        value: "2"
