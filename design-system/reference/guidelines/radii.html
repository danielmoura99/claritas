<!-- @dsCard group="Spacing" viewport="700x140" name="Corner radii" subtitle="Tight. Pills only for dots/toggles." -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.r{display:flex;gap:8px}.c{display:flex;flex-direction:column;gap:6px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}.n{font:500 11px/1.3 var(--font-mono);color:var(--text-secondary)}.h{font:400 10px/1.3 var(--font-mono);color:var(--text-tertiary)}.lbl{font:var(--text-label);letter-spacing:var(--label-track);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div class="r" style="gap:18px"><div class="c" style="flex:1"><div style="height:60px;border-radius:var(--radius-xs);background:var(--surface-raised);border:1px solid var(--border-strong)"></div><span class="n">radius-xs · 2</span><span class="h">chips no gráfico</span></div><div class="c" style="flex:1"><div style="height:60px;border-radius:var(--radius-sm);background:var(--surface-raised);border:1px solid var(--border-strong)"></div><span class="n">radius-sm · 4</span><span class="h">badges, inputs</span></div><div class="c" style="flex:1"><div style="height:60px;border-radius:var(--radius-md);background:var(--surface-raised);border:1px solid var(--border-strong)"></div><span class="n">radius-md · 6</span><span class="h">botões</span></div><div class="c" style="flex:1"><div style="height:60px;border-radius:var(--radius-lg);background:var(--surface-raised);border:1px solid var(--border-strong)"></div><span class="n">radius-lg · 10</span><span class="h">painéis</span></div><div class="c" style="flex:1"><div style="height:60px;border-radius:var(--radius-xl);background:var(--surface-raised);border:1px solid var(--border-strong)"></div><span class="n">radius-xl · 14</span><span class="h">diálogos</span></div><div class="c" style="flex:1"><div style="height:60px;border-radius:var(--radius-pill);background:var(--surface-raised);border:1px solid var(--border-strong)"></div><span class="n">radius-pill · 999</span><span class="h">switch, dots</span></div></div></body></html>
