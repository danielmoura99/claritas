<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.r{display:flex;gap:8px}.c{display:flex;flex-direction:column;gap:6px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}.n{font:500 11px/1.3 var(--font-mono);color:var(--text-secondary)}.h{font:400 10px/1.3 var(--font-mono);color:var(--text-tertiary)}.lbl{font:var(--text-label);letter-spacing:var(--label-track);text-transform:uppercase;color:var(--text-tertiary)}.p{flex:1;height:130px;border-radius:var(--radius-lg);box-shadow:var(--shadow-panel);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:10px}</style></head><body><div class="r" style="gap:12px"><div class="p" style="background:var(--bg-app)"><span class="h">bg-app — padrão</span></div><div class="p cl-dotgrid" style="background-color:var(--surface-inset)"><span class="h">grid-dots 16px — vazio / carregando</span></div><div class="p" style="background:var(--surface-inset)"><div style="position:absolute;top:0;bottom:0;width:40%;background:var(--scan-beam);border-right:1px solid rgba(243,237,226,.8);animation:cl-scan 2.6s linear infinite"></div><span class="h" style="position:relative">scan-beam — só durante análise</span></div></div></body></html>
