<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.r{display:flex;gap:8px}.c{display:flex;flex-direction:column;gap:6px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}.n{font:500 11px/1.3 var(--font-mono);color:var(--text-secondary)}.h{font:400 10px/1.3 var(--font-mono);color:var(--text-tertiary)}.lbl{font:var(--text-label);letter-spacing:var(--label-track);text-transform:uppercase;color:var(--text-tertiary)}.d{display:flex;align-items:baseline;gap:18px}.d .h{width:90px;flex-shrink:0}.m{font-family:var(--font-mono);font-variant-numeric:tabular-nums slashed-zero}</style></head><body><div class="c" style="gap:10px"><div class="d"><span class="h">num-xl 40</span><span class="m" style="font-size:40px;font-weight:500;letter-spacing:-.03em">R$ 38,42 <span style="color:var(--market-up-text);font-size:22px">▲ +1,21%</span></span></div><div class="d"><span class="h">num-l 26</span><span class="m" style="font-size:26px;font-weight:500;letter-spacing:-.02em">131.420 pts</span></div><div class="d"><span class="h">num-m 15</span><span class="m" style="font-size:15px;font-weight:500">61,27 · 34,18 · 52,90 · 27,61</span></div><div class="d"><span class="h">num-s 13</span><span class="m" style="font-size:13px;color:var(--text-secondary)">A 38,10  M 38,61  m 37,98  F 38,42  Vol 12,4M</span></div><div class="d"><span class="h">tabular</span><span class="m" style="font-size:13px;line-height:1.4;color:var(--text-secondary)">111,11<br>888,88</span><span class="h">pt-BR: vírgula decimal, ponto de milhar, sinal − verdadeiro</span></div></div></body></html>
