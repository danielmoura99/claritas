<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.r{display:flex;gap:8px}.c{display:flex;flex-direction:column;gap:6px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}.n{font:500 11px/1.3 var(--font-mono);color:var(--text-secondary)}.h{font:400 10px/1.3 var(--font-mono);color:var(--text-tertiary)}.lbl{font:var(--text-label);letter-spacing:var(--label-track);text-transform:uppercase;color:var(--text-tertiary)}.k{display:flex;align-items:center;gap:10px}.lg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 24px}</style></head><body><div class="lg"><div class="k"><svg width="28" height="28"><line x1="9" x2="9" y1="2" y2="26" stroke="var(--candle-up)"/><rect x="5" y="7" width="8" height="14" fill="var(--candle-up)"/><line x1="21" x2="21" y1="4" y2="24" stroke="var(--candle-down)"/><rect x="17" y="8" width="8" height="10" fill="var(--candle-down)"/></svg><div class="c" style="gap:2px"><span class="n">Velas</span><span class="h">osso / grafite; última vela em areia</span></div></div><div class="k"><svg width="28" height="28"><path d="M1 20 C8 8 16 22 27 8" stroke="var(--chart-ma-fast)" fill="none" stroke-width="1.25"/><path d="M1 22 C10 18 18 18 27 14" stroke="var(--chart-ma-slow)" stroke-opacity=".5" fill="none" stroke-width="1.25"/></svg><div class="c" style="gap:2px"><span class="n">Indicadores</span><span class="h">MM rápida areia · lenta cinza</span></div></div><div class="k"><svg width="28" height="28"><rect x="1" y="12" width="26" height="4" fill="var(--chart-volume-up)"/><rect x="1" y="18" width="26" height="4" fill="var(--chart-volume-down)"/></svg><div class="c" style="gap:2px"><span class="n">Volume</span><span class="h">branco 7–13%</span></div></div><div class="k"><svg width="28" height="28"><line x1="0" x2="28" y1="14" y2="14" stroke="var(--annotation)" stroke-dasharray="5 4"/></svg><div class="c"
