<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation & glow" subtitle="Borders + hairline highlight for structure; glow only for live things" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.r{display:flex;gap:8px}.c{display:flex;flex-direction:column;gap:6px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}.n{font:500 11px/1.3 var(--font-mono);color:var(--text-secondary)}.h{font:400 10px/1.3 var(--font-mono);color:var(--text-tertiary)}.lbl{font:var(--text-label);letter-spacing:var(--label-track);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div class="r" style="gap:16px"><div class="c" style="flex:1;gap:10px"><div style="height:72px;border-radius:var(--radius-lg);background:var(--surface-panel);box-shadow:var(--shadow-panel)"></div><span class="n">shadow-panel</span><span class="h">painel</span></div><div class="c" style="flex:1;gap:10px"><div style="height:72px;border-radius:var(--radius-lg);background:var(--surface-panel);box-shadow:var(--shadow-raised)"></div><span class="n">shadow-raised</span><span class="h">card</span></div><div class="c" style="flex:1;gap:10px"><div style="height:72px;border-radius:var(--radius-lg);background:var(--surface-panel);box-shadow:var(--shadow-pop)"></div><span class="n">shadow-pop</span><span class="h">popover / toast</span></div><div class="c" style="flex:1;gap:10px"><div style="height:72px;border-radius:var(--radius-lg);background:var(--surface-panel);box-shadow:var(--shadow-dialog)"></div><span class="n">shadow-dialog</span><span class="h">diálogo</span></div><div class="c" style="flex:1;gap:10px"><div style="height:72px;border-radius:var(--radius-lg);background:var(--surface-panel);box-shadow:var(--glow-sand)"></div><span class="n">glow-sand</span><span class="h">sinal novo</span></div><div class="c" style="flex:1;gap:10px"><div style="height:72px;border-radius:var(--radius-lg);background:var(--surface-panel);box-shadow:var(--glow-up)"></div><span class="n">glow-up</span><span class="h">alvo atingido</span></div></div></body></html>
