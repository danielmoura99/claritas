<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.r{display:flex;gap:8px}.c{display:flex;flex-direction:column;gap:6px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}.n{font:500 11px/1.3 var(--font-mono);color:var(--text-secondary)}.h{font:400 10px/1.3 var(--font-mono);color:var(--text-tertiary)}.lbl{font:var(--text-label);letter-spacing:var(--label-track);text-transform:uppercase;color:var(--text-tertiary)}.s{flex:1;height:110px;border-radius:var(--radius-lg);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;box-shadow:var(--shadow-panel)}</style></head><body><div class="r"><div class="s" style="background:var(--bg-app)"><span class="n">bg-app</span><span class="h">app</span></div><div class="s" style="background:var(--surface-inset)"><span class="n">surface-inset</span><span class="h">charts</span></div><div class="s" style="background:var(--surface-panel)"><span class="n">surface-panel</span><span class="h">modules</span></div><div class="s" style="background:var(--surface-raised)"><span class="n">surface-raised</span><span class="h">cards, dialogs</span></div><div class="s" style="background:var(--surface-hover)"><span class="n">surface-hover</span><span class="h">hover</span></div><div class="s" style="background:var(--surface-active)"><span class="n">surface-active</span><span class="h">selected</span></div></div><div class="r" style="margin-top:10px;gap:14px"><span style="flex:1;height:28px;border-radius:6px;border:1px solid var(--border-subtle);display:flex;align-items:center;padding:0 10px" class="h">border-subtle</span><span style="flex:1;height:28px;border-radius:6px;border:1px solid var(--border-default);display:flex;align-items:center;padding:0 10px" class="h">border-default</span><span style="flex:1;height:28px;border-radius:6px;border:1px solid var(--border-strong);display:flex;align-items:center;padding:0 10px" class="h">border-strong</span></div></body></html>
