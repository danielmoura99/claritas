<!-- @dsCard group="Motion" viewport="700x200" name="Durations & easing" subtitle="Decisive fast-out, soft landing. No bounce." -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.r{display:flex;gap:8px}.c{display:flex;flex-direction:column;gap:6px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}.n{font:500 11px/1.3 var(--font-mono);color:var(--text-secondary)}.h{font:400 10px/1.3 var(--font-mono);color:var(--text-tertiary)}.lbl{font:var(--text-label);letter-spacing:var(--label-track);text-transform:uppercase;color:var(--text-tertiary)}.row{display:grid;grid-template-columns:120px 1fr 80px;gap:12px;align-items:center;padding:4px 0}.track{height:4px;background:var(--ink-800);border-radius:4px;position:relative}.dot{position:absolute;top:-4px;width:12px;height:12px;border-radius:12px;background:var(--accent);animation:mv 2.4s var(--ease-out) infinite alternate}@keyframes mv{from{left:0}to{left:calc(100% - 12px)}}</style></head><body><div class="row"><span class="n">dur-tick · 140ms</span><div class="track"><div class="dot" style="animation-duration:140ms"></div></div><span class="h">preço, hover</span></div><div class="row"><span class="n">dur-fast · 180ms</span><div class="track"><div class="dot" style="animation-duration:180ms"></div></div><span class="h">controles</span></div><div class="row"><span class="n">dur-base · 260ms</span><div class="track"><div class="dot" style="animation-duration:260ms"></div></div><span class="h">tabs, painéis</span></div><div class="row"><span class="n">dur-slow · 480ms</span><div class="track"><div class="dot" style="animation-duration:480ms"></div></div><span class="h">sinal entrando</span></div><div class="row"><span class="n">dur-draw · 900ms</span><div class="track"><div class="dot" style="animation-duration:900ms"></div></div><span class="h">anotação desenhando</span></div><div class="row"><span class="n">dur-scan · 2600ms</span><div class="track"><div class="dot" style="animation-duration:2600ms"></div></div><span class="h">varredura</span></div></body></html>
