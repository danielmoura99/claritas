<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.r{display:flex;gap:8px}.c{display:flex;flex-direction:column;gap:6px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}.n{font:500 11px/1.3 var(--font-mono);color:var(--text-secondary)}.h{font:400 10px/1.3 var(--font-mono);color:var(--text-tertiary)}.lbl{font:var(--text-label);letter-spacing:var(--label-track);text-transform:uppercase;color:var(--text-tertiary)}.t{display:flex;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px solid var(--border-subtle)}.t span:first-child{width:150px}</style></head><body><div class="t"><span class="h">text-primary</span><span style="color:var(--text-primary);font:var(--text-body)">Petrobras PN · R$ 38,42</span></div><div class="t"><span class="h">text-secondary</span><span style="color:var(--text-secondary);font:var(--text-body)">Rompimento confirmado com volume acima da média</span></div><div class="t"><span class="h">text-tertiary</span><span style="color:var(--text-tertiary);font:var(--text-body)">Atualizado às 14:32:07 · 5m</span></div><div class="t"><span class="h">text-disabled</span><span style="color:var(--text-disabled);font:var(--text-body)">After-market indisponível</span></div><div class="t" style="border:0"><span class="h">text-on-accent</span><span style="background:var(--accent);color:var(--text-on-accent);font:500 13px/1 var(--font-sans);padding:6px 10px;border-radius:6px">Analisar agora</span></div></body></html>
