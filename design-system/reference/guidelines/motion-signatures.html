<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.r{display:flex;gap:8px}.c{display:flex;flex-direction:column;gap:6px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}.n{font:500 11px/1.3 var(--font-mono);color:var(--text-secondary)}.h{font:400 10px/1.3 var(--font-mono);color:var(--text-tertiary)}.lbl{font:var(--text-label);letter-spacing:var(--label-track);text-transform:uppercase;color:var(--text-tertiary)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.box{height:120px;border-radius:var(--radius-lg);background:var(--surface-inset);box-shadow:var(--shadow-panel);position:relative;overflow:hidden;display:grid;place-items:center}.beam{position:absolute;top:0;bottom:0;width:30%;background:var(--scan-beam);border-right:1px solid rgba(243,237,226,.8);animation:cl-scan 2.6s linear infinite}.px{font:500 22px/1 var(--font-mono)}.fl{animation:cl-flash-up 1.2s var(--ease-out) infinite;border-radius:2px}.line{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2.4s var(--ease-out) infinite}@keyframes dr{0%{stroke-dashoffset:1}50%,100%{stroke-dashoffset:0}}</style></head><body><div class="g"><div class="c"><div class="box"><span style="width:10px;height:10px;border-radius:10px;background:var(--market-up);color:var(--market-up);animation:cl-pulse 1.6s var(--ease-out) infinite"></span></div><span class="n">Pulso ao vivo</span><span class="h">cl-pulse 1.6s</span></div><div class="c"><div class="box"><span class="px">38,4<span class="fl">5</span></span></div><span class="n">Flash de dígito</span><span class="h">só o que mudou pisca</span></div><div class="c"><div class="box"><div class="beam"></div><span class="h">varrendo</span></div><span class="n">Feixe de análise</span><span class="h">cl-scan 2.6s linear</span></div><div class="c"><div class="box"><svg width="140" height="70"><line x1="4" y1="35" x2="136" y2="35" stroke="var(--accent)" stroke-dasharray="5 4" opacity=".35"/><path class="line" pathLength="1" d="M4 60 L50 40 L90 30 L136 10" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg></div><span class="n">Anotação desenhando</span><span class="h">cl-draw 900ms</span></div></div></body></html>
