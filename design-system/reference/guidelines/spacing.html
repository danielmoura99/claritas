<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.r{display:flex;gap:8px}.c{display:flex;flex-direction:column;gap:6px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}.n{font:500 11px/1.3 var(--font-mono);color:var(--text-secondary)}.h{font:400 10px/1.3 var(--font-mono);color:var(--text-tertiary)}.lbl{font:var(--text-label);letter-spacing:var(--label-track);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div class="r" style="align-items:flex-end;gap:14px"><div class="c" style="align-items:center"><div style="width:var(--space-1);height:var(--space-1);background:var(--accent);opacity:.85;border-radius:1px"></div><span class="n">1</span><span class="h" id="s1"></span></div><div class="c" style="align-items:center"><div style="width:var(--space-2);height:var(--space-2);background:var(--accent);opacity:.85;border-radius:1px"></div><span class="n">2</span><span class="h" id="s2"></span></div><div class="c" style="align-items:center"><div style="width:var(--space-3);height:var(--space-3);background:var(--accent);opacity:.85;border-radius:1px"></div><span class="n">3</span><span class="h" id="s3"></span></div><div class="c" style="align-items:center"><div style="width:var(--space-4);height:var(--space-4);background:var(--accent);opacity:.85;border-radius:1px"></div><span class="n">4</span><span class="h" id="s4"></span></div><div class="c" style="align-items:center"><div style="width:var(--space-5);height:var(--space-5);background:var(--accent);opacity:.85;border-radius:1px"></div><span class="n">5</span><span class="h" id="s5"></span></div><div class="c" style="align-items:center"><div style="width:var(--space-6);height:var(--space-6);background:var(--accent);opacity:.85;border-radius:1px"></div><span class="n">6</span><span class="h" id="s6"></span></div><div class="c" style="align-items:center"><div style="width:var(--space-7);height:var(--space-7);background:var(--accent);opacity:.85;border-radius:1px"></div><span class="n">7</span><span class="h" id="s7"></span></div><div class="c" style="align-items:center"><div style="width:var(--space-8);height:var(--space-8);background:var(--accent);opacity:.85;border-radius:1px"></div><span class="n">8</span><span class="h" id="s8"></span></div><div class="c" style="align-items:center"><div style="width:var(--space-9);height:var(--space-9);background:var(--accent);opacity:.85;border-radius:1px"></div><span class="n">9</span><span class="h" id="s9"></span></div><div class="c" style="align-items:center"><div style="width:var(--space-10);height:var(--space-10);background:var(--accent);opacity:.85;border-radius:1px"></div><span class="n">10</span><span class="h" id="s10"></span></div><div class="c" style="align-items:center"><div style="width:var(--space-11);height:var(--space-11);background:var(--accent);opacity:.85;border-radius:1px"></div><span class="n">11</span><span class="h" id="s11"></span></div><div class="c" style="align-items:center"><div style="width:var(--space-12);height:var(--space-12);background:var(--accent);opacity:.85;border-radius:1px"></div><span class="n">12</span><span class="h" id="s12"></span></div></div><script>for(let i=1;i<=12;i++)document.getElementById('s'+i).textContent=getComputedStyle(document.documentElement).getPropertyValue('--space-'+i).trim()</script></body></html>
